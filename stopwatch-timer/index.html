<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch &amp; Timer</title>
  <link rel="stylesheet" href="../style-guide/colors.css">
  <link rel="stylesheet" href="../style-guide/typography.css">
  <link rel="stylesheet" href="../style-guide/layout.css">
  <link rel="stylesheet" href="../style-guide/components.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav style="margin: 0;">
    <a href="../index.html" style="font-size:1.1rem; text-decoration:underline; color:#fff;">← Back to Landing Page</a>
  </nav>
  <header class="main-header" style="margin-top:0;">
    <h1>Stopwatch &amp; Timer</h1>
  </header>

  <main>
    <!-- Top row: mode switcher (left) + timer options (right, only when Timer active) -->
    <div class="top-row">
      <div class="mode-switcher">
        <button id="btnStopwatch" class="mode-btn active">Stopwatch</button>
        <button id="btnTimer" class="mode-btn">Timer</button>
      </div>

      <div id="timerOptions" class="timer-options card" style="display:none;">
        <div class="display-mode">
          <span class="label">Display mode:</span>
          <label class="radio-label">
            <input type="radio" name="displayMode" value="digital" checked>
            Digital
          </label>
          <label class="radio-label">
            <input type="radio" name="displayMode" value="clock">
            Clock Face
          </label>
          <label class="radio-label">
            <input type="radio" name="displayMode" value="progress">
            Progress Bar
          </label>
        </div>
        <div class="start-mode">
          <span class="label">Start mode:</span>
          <label class="radio-label">
            <input type="radio" name="startMode" value="simultaneous" checked>
            Simultaneous
          </label>
          <label class="radio-label">
            <input type="radio" name="startMode" value="async">
            Asynchronous
          </label>
        </div>
        <div class="sound-options">
          <label class="radio-label">
            <input type="checkbox" id="muteChimes">
            Mute chimes
          </label>
        </div>
        <div class="fs-timer-count">
          <span class="label">Fullscreen shows:</span>
          <label class="radio-label">
            <input type="radio" name="fsTimerCount" value="1" checked>
            1 timer
          </label>
          <label class="radio-label">
            <input type="radio" name="fsTimerCount" value="2">
            2 timers
          </label>
        </div>
      </div>
    </div>

    <!-- ==================== STOPWATCH ==================== -->
    <section id="stopwatchSection" class="tool-section">
      <div class="display-card">
        <div id="stopwatchDisplay" class="digital-display">00:00.00</div>
      </div>

      <div class="controls" id="swControls">
        <button id="swStartBtn" class="btn">Start</button>
        <button id="swStopBtn" class="btn" disabled>Stop</button>
        <button id="swLapBtn" class="btn" disabled>Lap</button>
        <button id="swResetBtn" class="btn">Reset</button>
        <button id="swFullscreenBtn" class="btn btn-fs">Fullscreen</button>
      </div>

      <div class="laps-card">
        <div class="laps-header">
          <h3>Lap Times</h3>
          <button id="clearLapsBtn" class="btn-small">Clear Laps</button>
        </div>
        <ol id="lapsList" class="laps-list">
          <!-- Laps will be inserted here -->
        </ol>
        <p id="noLapsMsg" class="no-laps">No laps recorded yet.</p>
      </div>
    </section>

    <!-- ==================== TIMER ==================== -->
    <section id="timerSection" class="tool-section" style="display:none;">

      <!-- Simultaneous shared controls -->
      <div id="simultaneousControls" class="controls shared-controls">
        <button id="tmStartBothBtn" class="btn">Start Both</button>
        <button id="tmPauseBothBtn" class="btn" disabled>Pause Both</button>
        <button id="tmResetBothBtn" class="btn">Reset Both</button>
        <button id="tmFullscreenBtn" class="btn btn-fs">Fullscreen</button>
      </div>

      <!-- Visible in async mode (and as Exit Fullscreen in FS when simultaneous is hidden) -->
      <div class="controls fs-entry-controls">
        <button id="tmFullscreenBtnAsync" class="btn btn-fs">Fullscreen</button>
      </div>

      <!-- Two timer panels -->
      <div class="dual-timers">

        <!-- ========== TIMER 1 ========== -->
        <div class="timer-panel timer-1">
          <h3 class="timer-title">Timer 1</h3>

          <div class="duration-inputs">
            <div class="input-group">
              <label for="t1Hours">Hours</label>
              <input type="number" id="t1Hours" min="0" max="23" value="0">
            </div>
            <div class="input-group">
              <label for="t1Minutes">Minutes</label>
              <input type="number" id="t1Minutes" min="0" max="59" value="5">
            </div>
            <div class="input-group">
              <label for="t1Seconds">Seconds</label>
              <input type="number" id="t1Seconds" min="0" max="59" value="0">
            </div>
          </div>

          <!-- Digital -->
          <div class="display-wrap digital-wrap" data-timer="1">
            <div class="digital-display" id="t1Digital">05:00</div>
            <div class="timer-status" id="t1Status"></div>
          </div>

          <!-- Clock face -->
          <div class="display-wrap clock-wrap" data-timer="1" style="display:none;">
            <svg class="clock-svg" id="t1ClockSvg" viewBox="0 0 300 300" width="200" height="200">
              <circle cx="150" cy="150" r="140" fill="#fff" stroke="#222" stroke-width="6"/>
              <g class="minute-markers"></g>
              <g class="hour-markers"></g>
              <circle cx="150" cy="150" r="8" fill="#222"/>
              <line class="minute-hand" x1="150" y1="150" x2="150" y2="40" stroke="#2a6edb" stroke-width="6" stroke-linecap="round"/>
              <line class="second-hand" x1="150" y1="150" x2="150" y2="25" stroke="#e94f37" stroke-width="3" stroke-linecap="round"/>
              <circle cx="150" cy="150" r="5" fill="#e94f37"/>
            </svg>
            <div class="clock-hint" id="t1ClockHint">05:00</div>
            <div class="timer-status" id="t1ClockStatus"></div>
          </div>

          <!-- Progress bar -->
          <div class="display-wrap progress-wrap" data-timer="1" style="display:none;">
            <div class="progress-label" id="t1ProgressLabel">05:00</div>
            <div class="progress-track">
              <div class="progress-fill" id="t1ProgressFill" style="width:0%"></div>
            </div>
            <div class="timer-status" id="t1ProgressStatus"></div>
          </div>

          <!-- Per-timer controls (visible in async mode) -->
          <div class="controls async-controls" data-timer="1">
            <button class="btn tm-start" data-timer="1">Start</button>
            <button class="btn tm-pause" data-timer="1" disabled>Pause</button>
            <button class="btn tm-reset" data-timer="1">Reset</button>
          </div>
        </div>

        <!-- ========== TIMER 2 ========== -->
        <div class="timer-panel timer-2">
          <h3 class="timer-title">Timer 2</h3>

          <div class="duration-inputs">
            <div class="input-group">
              <label for="t2Hours">Hours</label>
              <input type="number" id="t2Hours" min="0" max="23" value="0">
            </div>
            <div class="input-group">
              <label for="t2Minutes">Minutes</label>
              <input type="number" id="t2Minutes" min="0" max="59" value="3">
            </div>
            <div class="input-group">
              <label for="t2Seconds">Seconds</label>
              <input type="number" id="t2Seconds" min="0" max="59" value="0">
            </div>
          </div>

          <!-- Digital -->
          <div class="display-wrap digital-wrap" data-timer="2">
            <div class="digital-display" id="t2Digital">03:00</div>
            <div class="timer-status" id="t2Status"></div>
          </div>

          <!-- Clock face -->
          <div class="display-wrap clock-wrap" data-timer="2" style="display:none;">
            <svg class="clock-svg" id="t2ClockSvg" viewBox="0 0 300 300" width="200" height="200">
              <circle cx="150" cy="150" r="140" fill="#fff" stroke="#222" stroke-width="6"/>
              <g class="minute-markers"></g>
              <g class="hour-markers"></g>
              <circle cx="150" cy="150" r="8" fill="#222"/>
              <line class="minute-hand" x1="150" y1="150" x2="150" y2="40" stroke="#3bb273" stroke-width="6" stroke-linecap="round"/>
              <line class="second-hand" x1="150" y1="150" x2="150" y2="25" stroke="#e94f37" stroke-width="3" stroke-linecap="round"/>
              <circle cx="150" cy="150" r="5" fill="#e94f37"/>
            </svg>
            <div class="clock-hint" id="t2ClockHint">03:00</div>
            <div class="timer-status" id="t2ClockStatus"></div>
          </div>

          <!-- Progress bar -->
          <div class="display-wrap progress-wrap" data-timer="2" style="display:none;">
            <div class="progress-label" id="t2ProgressLabel">03:00</div>
            <div class="progress-track">
              <div class="progress-fill progress-fill-2" id="t2ProgressFill" style="width:0%"></div>
            </div>
            <div class="timer-status" id="t2ProgressStatus"></div>
          </div>

          <!-- Per-timer controls (visible in async mode) -->
          <div class="controls async-controls" data-timer="2">
            <button class="btn tm-start" data-timer="2">Start</button>
            <button class="btn tm-pause" data-timer="2" disabled>Pause</button>
            <button class="btn tm-reset" data-timer="2">Reset</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Math Tools Repository</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
